# ---- Data -------------------------------------------------------------
data:
  start: "2010-01-01"
  cache_dir: "data"
  # "yfinance" (free, dev), "tiingo", or "norgate" (Windows, NDU running)
  provider: "norgate"
  # "liquidity" = top-K by trailing 60d median dollar volume, evaluated day by
  #               day; common stock on a major exchange only (SPACs, ADRs,
  #               warrants, OTC excluded). Not bound to any index. (default)
  # "norgate"   = point-in-time index constituents incl. delisted (Platinum+)
  # "static"    = hand list in universe.py (or universe_csv) — survivorship-biased
  universe: "liquidity"
  liquidity_top_k: 1000          # universe = top-1000 by dollar volume; the band below picks ranks 451-1000
  # Trade only liquidity ranks lo+1..hi of that universe (null = trade the whole top-K). The exposure
  # gates still read the full top-K index. Sweep 2026-11-10: the SUE + FCF-yield ranker on ranks
  # 451-1000 (1.06 stitched Sharpe, 0.89 over T-bills) beat the best top-450 model (1.00 / 0.84);
  # the same ranker on the top 450 scores 0.99, and the old leader on the band only 0.94.
  liquidity_band: [450, 1000]
  min_price: 5.0
  index_name: "Russell 1000"     # only used when universe: norgate
  universe_csv: null

# ---- Signal / model ---------------------------------------------------
model:
  # "momentum" (no ML baseline) or "lgbm"
  # Live since 2026-11-10 pm (sweep leader): 0.5*sue + 0.5*fcf_yield on liquidity ranks 451-1000, 40 names,
  # with a 25% sector cap since the evening of 2026-11-10 (portfolio.sector_mode; equal sector split before).
  # Previous paper models: "c189f_fcfy30" on the top 450 (2026-11-10 am), "consistency_heavy" before that.
  type: "sue_fcfy"
  # forward-return horizon the ML model is trained to predict (trading days)
  horizon_days: 10
  # walk-forward: retrain every N trading days on a trailing window
  retrain_every_days: 63
  train_window_days: 756      # ~3 years
  min_train_days: 252
  # Fundamental features (Sharadar Fundamentals plan, SHARADAR_API_KEY in .env):
  #   null      price/volume features only
  #   sharadar  add point-in-time earnings/quality features (sue, gprof, fcf_yield, ...);
  #             needed by the "c189f_fcfy30" and "earnings" rankers. Rows cache in data/sharadar_arq.pkl.
  fundamentals: sharadar

# ---- Portfolio rules (your enter / add / trim / exit logic) -----------
portfolio:
  top_n: 40                   # hold the top-N ranked names (sweep 2026-11-10: 40 beat 55/70 on the band)
  # 1 = daily, 5 = weekly, 21 = monthly. Sweep 2026-11-11: averaged over every start day of the schedule,
  # stitched Sharpe is 1.161 / 1.119 / 1.094 / 1.088 / 1.073 for 1 / 2 / 3 / 4 / 5 days, and daily beat its
  # 3-day twin in 25 of 25 neighbouring setups. Daily trades ~30% more (18x vs 14x a year); its edge over
  # the 3-day average is +0.07 at the assumed 10 bps a trade, +0.03 at 20 bps, gone at ~30 bps.
  rebalance_every_days: 1
  # "optimizer" = Stage B: the model decides count and size (see below)
  # "rank" = weight grows with rank (your add-on-up / trim-on-down rule),
  # "equal", or "inverse_vol". top_n / min_trade_pct are ignored by "optimizer".
  sizing: "inverse_vol"       # sweep 2026-11-09: inverse-vol beat rank/equal on every window
  vol_lookback_days: 20
  max_weight: 0.10            # no single name above 10%
  min_trade_pct: 0.20         # only add/trim if |drift| > 20% of target weight
  cash_buffer: 0.02           # keep 2% cash
  # Optional: don't rebuy a name within N days of exiting it (reduces whipsaw)
  reentry_cooldown_days: 10
  # Sector rule on the top-N selection (GICS level 1, src/sectors.py); null = off
  #   "equal"  equal number of names per sector, leftovers from the overall ranking
  #   "cap"    plain ranking, but no sector takes more than sector_cap of the slots (0.25 = 10 of 40)
  # Sweep 2026-11-10 on the live ranker: cap 20% / 25% / 30% = 1.12 / 1.13 / 1.11 stitched Sharpe
  # vs 1.06 for "equal", 1.09 for no rule, 1.07 for a 15% cap. 25% is the centre of the plateau.
  sector_mode: "cap"
  sector_cap: 0.25
  # Exposure control (src/exposure.py): 15% vol target on the universe index,
  # halved when the universe 12m return is negative, halved again while NYSE
  # new highs minus new lows summed over 10 days is negative. Scales the invested budget.
  exposure: {vt: 15, ret_days: 252, ret_low: 0.5, hl_days: 10}
  # Idle-cash sleeve (src/sleeve.py): cash above cash_buffer that the exposure layer leaves
  # uninvested goes into these ETFs. Sweep: always-equal IEF+GLD = +0.14 Sharpe, +2.8 pts CAGR
  # over 26 years, worst year -12%. null = off (cash stays cash).
  sleeve: {assets: [IEF, GLD], rule: always_eq}
  # null = off (cash stays cash); frac: 0.5 would put only half the idle cash in the sleeve
  # Backtest accounting only: remaining idle cash earns the 13-week T-bill yield (%IRX)
  cash_yield: true
  # Several rankers sharing the account (src/books.py). null = one book from model.type.
  # Weights must sum to 1; each book keeps its own state file data/live_state_<name>.json.
  # Sweep 2026-11-09: momentum + earnings (model.fundamentals: sharadar) 50/50 beat either alone.
  # Example:
  #   books:
  #     - {name: momentum, ranker: consistency_heavy, weight: 0.7}
  #     - {name: earnings, ranker: earnings, weight: 0.3, top_n: 40}
  books: null

# ---- Stage B optimizer (sizing: "optimizer") ---------------------------
# Scores -> expected returns (IC * z-score * stock vol); recent returns ->
# shrunk covariance; a constrained optimizer picks weights and, implicitly,
# how many names to hold. Only risk appetite and cost penalty are set here.
optimizer:
  risk_aversion: 8.0          # higher = more names, smaller bets, more cash
  tc_bps: 20                  # flat penalty, only used if costs.model is "flat"
  tc_multiplier: 1.5          # pessimism applied to per-name cost estimates
  cov_lookback: 120
  shrinkage: 0.5              # 0 = raw sample cov, 1 = ignore correlations
  ic_default: 0.03            # assumed edge until trailing IC is measured
  ic_floor: 0.0               # trailing IC at/below this -> fully to cash
  min_weight: 0.005           # drop positions smaller than 0.5%
  max_positions: null         # null = model decides; or an integer cap

# ---- Cost model -------------------------------------------------------
# "impact": cost grows with each trade's size vs the stock's daily dollar
#           volume (square-root market impact) — this is what lets the
#           optimizer decide for itself which thin names are worth touching.
# "flat":   a single slippage number (the old behaviour; optimistic in small caps)
costs:
  model: "impact"
  capital: 100000             # your account size in $; impact scales with it
  spread_bps: 3               # half-spread paid on every trade
  impact_coef: 0.1            # raise if live fills are worse than backtest
  max_participation: 0.05     # never plan > 5% of a stock's ADV in one day
  flat_bps: 10                # used by "flat", and as the floor for "impact"
  commission_per_trade: 0.0   # Alpaca is commission-free
  fill: "close"               # decide after close; backtest fills at the close

# ---- Auto-tune (optimizer appetite picked by walk-forward backtest) ----
# At each retrain, replays the last tune_window days of allocation with every
# (risk_aversion, tc_multiplier) combo and keeps the best after-cost Sharpe.
# Only past data is used. Small grid on purpose: every extra knob the model
# gets to pick is another way to overfit history.
auto_tune:
  enabled: true
  risk_aversion: [4, 8, 16]
  tc_multiplier: [1.0, 1.5, 2.5]
  tune_window: 252
  tune_rebalance_every: 5

# ---- Live ---------------------------------------------------------------
live:
  # Run after close so today's bar is complete; orders queue for next open
  schedule_local_time: "16:30"
  timezone: "America/Chicago"
  # How orders reach Alpaca (paper and live):
  #   market  fractional notional market orders, DAY (default; fill shortly after the open)
  #   opg     whole-share market-on-open orders in the opening auction, which is the fill the
  #           backtest assumes; the sub-share remainder goes as a small DAY notional order.
  #           Compare fills with scripts/reconcile_fills.py after a few runs.
  order_type: "market"
  # Memory guard (src/memguard.py): the daily job is stopped, before any order is sent, if free RAM
  # falls below this many GB. An unguarded run froze the PC on 2026-11-11. null = off.
  min_free_gb: 1.0
