# ---- Data -------------------------------------------------------------
data:
  start: "2010-01-01"
  cache_dir: "data"
  # "yfinance" (free, dev), "tiingo", or "norgate" (Windows, NDU running)
  provider: "norgate"
  # "liquidity" = top-K by trailing 60d median dollar volume, evaluated day by
  #               day; common stock on a major exchange only (SPACs, ADRs,
  #               warrants, OTC excluded). Not bound to any index. (default)
  # "norgate"   = point-in-time index constituents incl. delisted (Platinum+)
  # "static"    = hand list in universe.py (or universe_csv) — survivorship-biased
  universe: "liquidity"
  liquidity_top_k: 3000          # universe = top-3000 by dollar volume; the band below picks ranks 151-3000
  # Trade only liquidity ranks lo+1..hi of that universe (null = trade the whole top-K). The exposure
  # gates still read the full top-K index. Sweep 2026-11-10: the SUE + FCF-yield ranker on ranks
  # 451-1000 (1.06 stitched Sharpe, 0.89 over T-bills) beat the best top-450 model (1.00 / 0.84);
  # the same ranker on the top 450 scores 0.99, and the old leader on the band only 0.94.
  # Sweep 2026-11-11 (daily rebalance): a wider band with a few more names is a plateau - lower edge
  # 100-300 x 45-55 names = 1.16-1.20 stitched vs 1.161 for ranks 451-1000 x 40. Ranks 201-1000 x 45
  # (1.198, 2000s 1.303) also wins at 20 bps (1.058 vs 1.007) and on the 2- and 3-day schedules.
  # Sweep 2026-11-12 (rounds 42/44, ranker sue_fcfy_q6): wider is better at every step - ranks 201-1000
  # 1.264 stitched, 201-1250 1.358, 201-1500 1.404 (2000s 1.638, CAGR 15.7%), 201-2000 1.466. At a flat
  # 20 bps a trade 201-1500 still scores 1.276 (201-1000: 1.124), at 30 bps 1.149 (0.985).
  # REVERTED the same day: the sweep's fundamentals covered only names ever in the top 1000 (2000-2026), so
  # in those wider-universe backtests a rank-1200 stock had data only if it later grew into the top 1000
  # (look-ahead). Ranks 201-1000 are unaffected. The wide results are being rerun on complete panels.
  # Since 2026-11-14 (rounds 51/53/54, complete panels, realistic timing = fills at the next open, filings usable the
  # next day): ranks 201-2500 with the four rules below (fresh entry, sqrt market-cap sizing, risk-parity sleeve,
  # Altman-Z screen) = stitched 1.357 vs 1.188 for the old ranks 201-1000 model; under a trading cost MEASURED by
  # liquidity rank (high-low spread estimator: ranks 2001-2500 pay +16 bps in 2000-04, +6-7 bps since 2010)
  # 1.333 vs 1.183, at double that spread excess still ahead. Ranks 201-3000 tie (1.334) with a deeper drawdown.
  # Since 2026-11-18 (rounds 67-72): ranks 151-3000 together with fresh_entry_days 42 and the put/call gate (see
  # portfolio.exposure): stitched 1.479 vs 1.408, 1.437 vs 1.377 under the measured cost-by-rank schedule.
  liquidity_band: [150, 3000]
  min_price: 5.0
  index_name: "Russell 1000"     # only used when universe: norgate
  universe_csv: null

# ---- Signal / model ---------------------------------------------------
model:
  # "momentum" (no ML baseline) or "lgbm"
  # Live since 2026-11-10 pm (sweep leader): 0.5*sue + 0.5*fcf_yield on liquidity ranks 451-1000, 40 names,
  # with a 25% sector cap since the evening of 2026-11-10 (portfolio.sector_mode; equal sector split before).
  # Daily rebalancing since 2026-11-11 midday; ranks 201-1000 with 45 names since 2026-11-11 afternoon.
  # Previous paper models: "c189f_fcfy30" on the top 450 (2026-11-10 am), "consistency_heavy" before that.
  # Since 2026-11-12: "sue_fcfy_q6" = sue_fcfy at 80% + 20% split over sur / ebitda_ev / sp / opprof / roic / fscore
  # (needs the extra Sharadar columns; an old data/sharadar_arq.pkl is refetched once automatically).
  type: "sue_fcfy_q6"
  # Value screen on today's cross-section (src/ranking.apply_screen): a name with Altman Z below 1.81 (the distress
  # zone) leaves the ranking, a held one is sold; names without a Z stay. null = off.
  screen: [{feat: altz, min: 1.81}]
  # forward-return horizon the ML model is trained to predict (trading days)
  horizon_days: 10
  # walk-forward: retrain every N trading days on a trailing window
  retrain_every_days: 63
  train_window_days: 756      # ~3 years
  min_train_days: 252
  # Fundamental features (Sharadar Fundamentals plan, SHARADAR_API_KEY in .env):
  #   null      price/volume features only
  #   sharadar  add point-in-time earnings/quality features (sue, gprof, fcf_yield, ...);
  #             needed by the "c189f_fcfy30" and "earnings" rankers. Rows cache in data/sharadar_arq.pkl.
  fundamentals: sharadar

# ---- Portfolio rules (your enter / add / trim / exit logic) -----------
portfolio:
  top_n: 45                   # hold the top-N ranked names (45 on ranks 201-1000 and 201-1500; 40 was best on ranks 451-1000)
  # 1 = daily, 5 = weekly, 21 = monthly. Sweep 2026-11-11: averaged over every start day of the schedule,
  # stitched Sharpe is 1.161 / 1.119 / 1.094 / 1.088 / 1.073 for 1 / 2 / 3 / 4 / 5 days, and daily beat its
  # 3-day twin in 25 of 25 neighbouring setups. Daily trades ~30% more (18x vs 14x a year); its edge over
  # the 3-day average is +0.07 at the assumed 10 bps a trade, +0.03 at 20 bps, gone at ~30 bps.
  rebalance_every_days: 1
  # "optimizer" = Stage B: the model decides count and size (see below)
  # "rank" = weight grows with rank (your add-on-up / trim-on-down rule),
  # "equal", or "inverse_vol". top_n / min_trade_pct are ignored by "optimizer".
  # "sqrt_mcap" (since 2026-11-14) = weight ~ sqrt(point-in-time market cap: the last filing's Sharadar market cap
  # carried by the price move since); with ranks up to 2500 it keeps the smallest names small.
  sizing: "sqrt_mcap"         # was "inverse_vol" (sweep 2026-11-09: beat rank/equal on every window)
  vol_lookback_days: 20
  max_weight: 0.10            # no single name above 10%
  min_trade_pct: 0.20         # only add/trim if |drift| > 20% of target weight
  cash_buffer: 0.02           # keep 2% cash
  # Optional: don't rebuy a name within N days of exiting it (reduces whipsaw)
  reentry_cooldown_days: 10
  # A name not held may only be bought within N trading days of its last filing (the day its SUE changed); held
  # names are unaffected. null = off. Round 51: 21 days (14 / 30 neighbours agree). 42 since 2026-11-18 (with the
  # wider band and the put/call gate; fresh 42 alone on the old band: 1.481 with the gates).
  fresh_entry_days: 42
  # Sector rule on the top-N selection (GICS level 1, src/sectors.py); null = off
  #   "equal"  equal number of names per sector, leftovers from the overall ranking
  #   "cap"    plain ranking, but no sector takes more than sector_cap of the slots (0.25 = 11 of 45)
  # Sweep 2026-11-10 on the live ranker: cap 20% / 25% / 30% = 1.12 / 1.13 / 1.11 stitched Sharpe
  # vs 1.06 for "equal", 1.09 for no rule, 1.07 for a 15% cap. 25% is the centre of the plateau.
  sector_mode: "cap"
  sector_cap: 0.25
  # Exposure control (src/exposure.py): 15% vol target on the universe index (10-day vol),
  # halved when the universe 12m return is negative, halved while NYSE new highs minus
  # new lows summed over 5 days is negative, halved while the NYSE A/D line is below its
  # 100-day MA. Scales the invested budget.
  # Since 2026-11-18 (rounds 63-66): vt_win 20 -> 10, hl_days 10 -> 5, A/D gate added.
  # Stitched Sharpe 1.408 vs 1.348 for the previous settings in the same build (2000s 1.768
  # vs 1.760, CAGR 15.1% vs 14.7%, max drawdown -17.1% vs -21.8%); all 10 neighbour cells
  # 1.377-1.421. Under the measured cost-by-rank schedule 1.377 vs 1.324.
  # Since 2026-11-18 (rounds 67-72): also halved while the CBOE equity put/call ratio (20-day average) is in the
  # lowest 5% of its trailing year (complacency). With ranks 151-3000 and fresh entry 42: stitched 1.479 vs 1.408,
  # excess 1.304 vs 1.237, 2000s 1.929 vs 1.768, CAGR 15.6% vs 15.1%, max DD -16.8% vs -17.1%, worst year -10.1%
  # vs -10.7%; under the measured cost-by-rank schedule 1.437 vs 1.377, at double that 1.404 vs 1.346 (with NFCI).
  # Neighbours (put/call 3/5/10/20%, NFCI variants, each half of the stock change) 1.45-1.50. The NFCI gate
  # (src/exposure.py nfci_gt) added only +0.007 and its history is revised weekly, so it is left off.
  exposure: {vt: 15, vt_win: 10, ret_days: 252, ret_low: 0.5, hl_days: 5, ad_ma: 100, pcr_pct: 0.05}
  # Idle-cash sleeve (src/sleeve.py): cash above cash_buffer that the exposure layer leaves
  # uninvested goes into these ETFs. Sweep: always-equal IEF+GLD = +0.14 Sharpe, +2.8 pts CAGR
  # over 26 years, worst year -12%. null = off (cash stays cash).
  # Since 2026-11-14: rule "rp" = inverse 63-day volatility weights (IEF ~80%, GLD ~20% lately) instead of equal.
  sleeve: {assets: [IEF, GLD], rule: rp}
  # null = off (cash stays cash); frac: 0.5 would put only half the idle cash in the sleeve
  # Backtest accounting only: remaining idle cash earns the 13-week T-bill yield (%IRX)
  cash_yield: true
  # Several rankers sharing the account (src/books.py). null = one book from model.type.
  # Weights must sum to 1; each book keeps its own state file data/live_state_<name>.json.
  # Sweep 2026-11-09: momentum + earnings (model.fundamentals: sharadar) 50/50 beat either alone.
  # Example:
  #   books:
  #     - {name: momentum, ranker: consistency_heavy, weight: 0.7}
  #     - {name: earnings, ranker: earnings, weight: 0.3, top_n: 40}
  books: null

# ---- Stage B optimizer (sizing: "optimizer") ---------------------------
# Scores -> expected returns (IC * z-score * stock vol); recent returns ->
# shrunk covariance; a constrained optimizer picks weights and, implicitly,
# how many names to hold. Only risk appetite and cost penalty are set here.
optimizer:
  risk_aversion: 8.0          # higher = more names, smaller bets, more cash
  tc_bps: 20                  # flat penalty, only used if costs.model is "flat"
  tc_multiplier: 1.5          # pessimism applied to per-name cost estimates
  cov_lookback: 120
  shrinkage: 0.5              # 0 = raw sample cov, 1 = ignore correlations
  ic_default: 0.03            # assumed edge until trailing IC is measured
  ic_floor: 0.0               # trailing IC at/below this -> fully to cash
  min_weight: 0.005           # drop positions smaller than 0.5%
  max_positions: null         # null = model decides; or an integer cap

# ---- Cost model -------------------------------------------------------
# "impact": cost grows with each trade's size vs the stock's daily dollar
#           volume (square-root market impact) — this is what lets the
#           optimizer decide for itself which thin names are worth touching.
# "flat":   a single slippage number (the old behaviour; optimistic in small caps)
costs:
  model: "impact"
  capital: 100000             # your account size in $; impact scales with it
  spread_bps: 3               # half-spread paid on every trade
  impact_coef: 0.1            # raise if live fills are worse than backtest
  max_participation: 0.05     # never plan > 5% of a stock's ADV in one day
  flat_bps: 10                # used by "flat", and as the floor for "impact"
  commission_per_trade: 0.0   # Alpaca is commission-free
  fill: "close"               # decide after close; backtest fills at the close

# ---- Auto-tune (optimizer appetite picked by walk-forward backtest) ----
# At each retrain, replays the last tune_window days of allocation with every
# (risk_aversion, tc_multiplier) combo and keeps the best after-cost Sharpe.
# Only past data is used. Small grid on purpose: every extra knob the model
# gets to pick is another way to overfit history.
auto_tune:
  enabled: true
  risk_aversion: [4, 8, 16]
  tc_multiplier: [1.0, 1.5, 2.5]
  tune_window: 252
  tune_rebalance_every: 5

# ---- Live ---------------------------------------------------------------
live:
  # Run after close so today's bar is complete; orders queue for next open
  schedule_local_time: "16:30"
  timezone: "America/Chicago"
  # How orders reach Alpaca (paper and live):
  #   market  fractional notional market orders, DAY (default; fill shortly after the open)
  #   opg     whole-share market-on-open orders in the opening auction, which is the fill the
  #           backtest assumes; the sub-share remainder goes as a small DAY notional order.
  #           Compare fills with scripts/reconcile_fills.py after a few runs.
  # "opg" since 2026-11-13 (user decision after the bug audit): the backtests are re-baselined on next-open fills,
  # and Alpaca accepts auction orders only before 09:28 / after 19:00 ET, so run_daily waits for 19:01 ET to send.
  # 2026-11-18: on the paper account ~97% of OPG orders EXPIRED unfilled at the open (11-13..11-17: 138 expired,
  # 6 filled), so the account stopped following the model. The 11-18 evening orders were resent as "market"
  # (DAY orders queue for the open and fill within minutes of it). From 11-19: "opg" again WITH the morning
  # fallback (scripts/open_fallback.py, Task Scheduler "StockTrader Open Fallback", weekdays 8:32 am CT): every
  # auction order that did not fill is resent as a market order within open_fallback_window_min of the open.
  # 2026-11-20: the fallback task repeats every 3 min until 8:50 am CT; on 11-18 Alpaca marked auction orders expired
  # from 9:30:31 to 9:33:10 ET, so a single 9:32 ET check would have skipped 5 of 59 (still "new" when it looked).
  # The paper account proves the fallback (its auctions almost never fill); a real account gets the auction price
  # whenever the auction works.
  order_type: "opg"
  open_fallback: true
  open_fallback_window_min: 60
  # Memory guard (src/memguard.py): the daily job is stopped, before any order is sent, if free RAM
  # falls below this many GB. An unguarded run froze the PC on 2026-11-11. null = off.
  min_free_gb: 1.0
  # Daily-job supervisor (scripts/run_daily_retry.py, run by Task Scheduler "StockTrader Daily"): when run_daily stops
  # without finishing (memory guard or data not current = exit 3, or a crash) it runs it again every_min minutes
  # later, at most max_attempts runs, never starting after last_start (local) so the batch keeps today's date.
  # A safety stop (exit 4) is never retried. Discord alerts (report channel): first stop, recovery, giving up,
  # safety stop, and a finished run that wrote to data/run_daily_errors.log. 2026-11-20: added after the 11-19 run
  # was stopped by the memory guard at 5:30 pm CT and only a manual rerun at 6:44 pm sent the orders.
  retry: {every_min: 30, max_attempts: 6, last_start: "22:00", attempt_timeout_min: 90}
  # Safety limits (src/safety.py), checked right before orders go out; any stop = no orders that day, exit code 4.
  # Defaults sit just above the live model's backtest extremes (stock turnover 0.67, sleeve change 0.81, 38-45 names).
  # Real money also needs LIVE_TRADING_CONFIRM=yes-real-money in .env next to ALPACA_PAPER=false.
  safety:
    kill_switch: data/STOP        # create this file to stop all trading; delete it to resume
    max_equity_change: 0.25       # vs the last logged session (deposits above this: run once with --allow-full-rebuild)
    min_positions: 30
    max_positions: 60
    max_order_pct: 0.12           # one stock order, fraction of equity (max_weight is 0.10)
    max_sleeve_order_pct: 0.85    # one sleeve ETF order
    max_stock_turnover: 0.9       # stock buys + sells in one day
    max_total_turnover: 1.8       # stocks + sleeve in one day (selling everything and rebuying = 2.0)
    max_price_move: 0.5           # a stock moving more than this since the last close is not traded that day
